name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # dorny/test-reporter publishes a check run with the test results.
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
#  vulnerabilities:    #removed following security incident
#    runs-on: ubuntu-latest
#    steps:
#      - name: Checkout code
#        uses: actions/checkout@v3
#
#      - name: Scan repository for vulnerabilities
#        uses: aquasecurity/trivy-action@master
#        with:
#          scan-type: 'fs'
#          ignore-unfixed: true
#          format: 'table'
#          exit-code: '1'
#          severity: 'CRITICAL,HIGH'

  static_analysis:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup php
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: copy env file
        run: cp .env.example .env

      - name: setup cache folders
        run: mkdir -p storage/framework/{sessions,views,cache}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer install --no-ansi --no-interaction --no-scripts --prefer-dist --no-progress
          php artisan package:discover --ansi

      - name: generate app key
        run: php artisan key:generate

      # Existing errors are recorded in phpstan-baseline.neon; new ones fail the build.
      - name: Larastan (static analysis)
        run: composer check:types -- --no-progress --error-format=github

      # Non-blocking until the existing Rector findings are cleaned up.
      # Once they are fixed, drop continue-on-error.
      - name: Rector (dry run)
        continue-on-error: true
        run: composer check:refactor

      # Non-blocking until the existing style violations are fixed with `vendor/bin/pint`.
      - name: Pint (code style)
        continue-on-error: true
        run: composer check:style

  laravel_tests:
    name: Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    env:
      XDEBUG_MODE: coverage
      APP_ENV: testing
      AUTH0_CLIENT_ID: ${{ secrets.DEV_AUTH0_CLIENTID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.DEV_AUTH0_CLIENTSECRET }}
      AUTH0_DOMAIN: ${{ secrets.DEV_AUTH0_DOMAIN }}
      AUTH0_CUSTOM_DOMAIN: ${{ secrets.DEV_AUTH0_CUST_DOMAIN }}
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      # Checkout first: setup-node's npm cache needs package-lock.json.
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup php
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm

      - name: copy env file
        run: cp .env.example .env

      - name: setup cache folders
        run: mkdir -p storage/framework/{sessions,views,cache}

      - name: Force git to use ssh
        run: git config --global url."git@github.com:".insteadOf git://github.com/

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
#        env:
#          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.COMPOSER_AUTH}}"} }'
        run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist --no-progress

      # Filament/Livewire assets are no longer committed. The Filament theme
      # (resources/css/filament/dashboard/theme.scss) imports
      # public/css/filament/filament/app.css, so publish them before the Vite build.
      - name: publish package assets
        run: |
          php artisan package:discover --ansi
          php artisan filament:assets
          php artisan livewire:publish --assets

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: npm run build
        run: npm run build

      - name: generate app key
        run: php artisan key:generate

      - name: run Laravel tests
        run: php artisan test --coverage --parallel --coverage-html=coverage

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: code-coverage-report
          path: coverage

      - name: Report test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: Assess System Tests
          path: 'reports/test-results.xml'
          reporter: 'phpunit-junit'
          only-summary: 'false'
          fail-on-error: 'false'
